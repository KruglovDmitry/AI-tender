[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-tender"
version = "0.1.0"
description = "LlamaIndex RAG: вхождения эталонных ТС в тендер и оценка LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "llama-index",
  "llama-index-embeddings-huggingface",
  "llama-index-llms-openai",
  "llama-index-llms-openai-like",
  "llama-index-readers-file",
  "llama-index-retrievers-bm25",
  "docx2txt",
  "numpy",
  "pandas",
  "pydantic>=2",
  "pydantic-settings",
  "python-dotenv",
  "pymupdf",
  "pytesseract",
  "pillow",
  "rarfile",
  "sentence-transformers",
  "sharepoint-to-text",
  "langgraph>=0.2",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "httpx",
  "playwright",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "python-docx"]
native = ["pywebview>=5.0"]

[project.scripts]
ai-tender-api = "ai_tender.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_tender"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
