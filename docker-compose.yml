services:
  ai-tender:
    build: .
    container_name: ai-tender
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "1"
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      TESSERACT_CMD: /usr/bin/tesseract
    volumes:
      - ./sources:/data/tender:ro
      - ./assets:/data/assets:ro
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  hf_cache:
