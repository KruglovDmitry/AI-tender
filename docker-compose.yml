services:
  ai-tender:
    build: .
    container_name: ai-tender
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "1"
      PYTHONPATH: /app/src
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      TESSERACT_CMD: /usr/bin/tesseract
    volumes:
      - ./sources:/data/tender:ro
      - ./assets:/data/assets
      - ./data:/app/data
      - ./src:/app/src:ro
      - model_cache:/root/.cache
    restart: unless-stopped

volumes:
  model_cache:
